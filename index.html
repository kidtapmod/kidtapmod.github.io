<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Truy tìm KitKat</title>

    <!-- Pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --green-dark: #0b3f34;
            --green: #145c48;
            --green-light: #2c8b68;
            --cream: #fffdf3;
            --text: #183c32;
            --red: #d71920;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(77, 150, 104, 0.3), transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(77, 150, 104, 0.25), transparent 25%),
                linear-gradient(135deg, #063f32, #082e27);
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-wrapper {
            width: 100%;
            max-width: 720px;
            position: relative;
        }

        /* ================= HEADER ================= */

        .hero {
            min-height: 260px;
            border-radius: 28px 28px 0 0;
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(7, 53, 42, 0.95),
                    rgba(13, 83, 61, 0.8)
                );
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(74, 222, 128, 0.08);
            top: -150px;
            left: -100px;
        }

        .hero::after {
            content: "🍃 ✦ 🌿 ✦ 🍃";
            position: absolute;
            bottom: 15px;
            left: 20px;
            opacity: 0.4;
            font-size: 24px;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 35px 30px;
            color: white;
        }

        .hero-title-small {
            font-size: 34px;
            font-weight: 800;
            color: #f6e9c5;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.25);
        }

        .hero-title-big {
            font-size: 70px;
            line-height: 0.9;
            font-weight: 900;
            color: white;
            letter-spacing: -3px;
            text-shadow:
                3px 3px 0 #b51218,
                6px 6px 0 rgba(0,0,0,0.2);
        }

        .hero-subtitle {
            margin-top: 20px;
            font-size: 19px;
            color: #d7f3df;
        }

        /* Thanh KitKat CSS */

        .kitkat-logo {
            position: absolute;
            top: 25px;
            right: 30px;

            width: 150px;
            height: 75px;

            background: linear-gradient(
                135deg,
                #f02a2f,
                #b7090e
            );

            border-radius: 12px;

            transform: rotate(8deg);

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 29px;
            font-weight: 900;
            font-style: italic;

            border: 3px solid white;

            box-shadow:
                0 8px 15px rgba(0,0,0,0.35);
        }

        .kitkat-logo::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 8px;
        }

        /* ================= GAME CARD ================= */

        .game-container {
            background: var(--cream);
            border-radius: 32px;
            margin-top: -5px;
            padding: 30px 28px 35px;
            color: var(--text);

            position: relative;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        .game-container::before {
            content: "";
            position: absolute;
            inset: 22px;

            border: 2px dashed rgba(20, 92, 72, 0.18);
            border-radius: 25px;

            pointer-events: none;
        }

        /* Header câu hỏi */

        .quiz-top {
            position: relative;
            z-index: 2;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .question-counter {
            background: linear-gradient(
                135deg,
                #0c4d3d,
                #247357
            );

            color: white;

            padding: 13px 22px;

            border-radius: 30px;

            font-size: 18px;
            font-weight: bold;

            box-shadow:
                0 5px 10px rgba(0,0,0,0.15);
        }

        .kitkat-count {
            background: #fff5f5;

            color: #b51218;

            border: 2px solid #efb0b0;

            padding: 10px 16px;

            border-radius: 25px;

            font-weight: 800;
        }

        /* Câu hỏi */

        .question-text {
            position: relative;
            z-index: 2;

            font-size: 30px;
            line-height: 1.35;

            font-weight: 800;

            text-align: center;

            margin:
                20px 20px
                35px;
        }

        /* ================= OPTIONS ================= */

        .options-list {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-btn {
            width: 100%;

            padding: 22px 24px;

            border-radius: 22px;

            border: 2px solid rgba(20, 92, 72, 0.25);

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #edf7ef
                );

            color: var(--text);

            font-size: 20px;

            text-align: left;

            cursor: pointer;

            transition:
                0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-3px);

            border-color: #24815f;

            box-shadow:
                0 8px 18px rgba(20, 92, 72, 0.15);
        }

        /* Đáp án đúng */

        .option-btn.correct {
            background:
                linear-gradient(
                    135deg,
                    #145c48,
                    #287e5f
                ) !important;

            color: white !important;

            border-color: #0b4939 !important;

            font-weight: bold;

            position: relative;
        }

        .option-btn.correct::before {
            content: "✓";

            font-size: 28px;

            margin-right: 15px;
        }

        /* Sai */

        .option-btn.wrong {
            background: #fff0f0 !important;
            border-color: #ef4444 !important;
        }

        /* Rung */

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        /* ================= REWARD ================= */

        .reward-box {
            position: relative;
            z-index: 2;

            margin-top: 28px;

            display: none;

            align-items: center;
            justify-content: center;
            gap: 15px;

            background:
                linear-gradient(
                    135deg,
                    #fff7df,
                    #fffdf5
                );

            border: 2px solid #e7d5a2;

            border-radius: 22px;

            padding: 16px;

            font-size: 20px;

            box-shadow:
                0 8px 20px rgba(120,90,30,0.12);
        }

        .reward-box.show {
            display: flex;
            animation: rewardPop 0.4s ease;
        }

        @keyframes rewardPop {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .reward-bar {
            width: 85px;
            height: 40px;

            background:
                linear-gradient(
                    135deg,
                    #ee2228,
                    #bd080e
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 900;
            font-style: italic;

            border-radius: 7px;

            transform: rotate(-8deg);

            border: 2px solid white;

            box-shadow:
                0 5px 10px rgba(0,0,0,0.2);
        }

        .reward-text strong {
            color: #168052;
            font-size: 26px;
        }

        /* ================= PROGRESS ================= */

        .progress-wrapper {
            position: relative;
            z-index: 2;

            margin-top: 30px;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            align-items: center;

            position: relative;
        }

        .progress::before {
            content: "";

            position: absolute;

            height: 4px;

            background: #d7ddd8;

            left: 7%;
            right: 7%;

            top: 16px;

            z-index: 0;
        }

        .progress-step {
            position: relative;
            z-index: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            font-weight: bold;

            color: #5f6d66;
        }

        .circle {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            background: #e4e8e5;

            border: 3px solid #cfd6d1;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 7px;
        }

        .progress-step.done .circle {
            background: #23815f;
            color: white;
            border-color: #23815f;
        }

        .progress-step.active .circle {
            background: #fff;
            border-color: #23815f;
        }

        /* ================= RESULT ================= */

        .result-screen {
            position: relative;
            z-index: 2;

            text-align: center;

            display: none;

            padding: 40px 10px;
        }

        .result-screen h2 {
            font-size: 34px;
            color: #168052;
            margin-bottom: 15px;
        }

        .result-screen p {
            font-size: 20px;
            line-height: 1.6;
        }

        .final-kitkat {
            margin: 25px auto;

            background: #fff5df;

            border: 2px solid #ecd7a5;

            border-radius: 25px;

            padding: 20px;

            max-width: 400px;

            font-size: 25px;

            font-weight: bold;

            color: #b51218;
        }

        .restart-btn {
            border: none;

            padding: 16px 30px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #d71920,
                    #aa080d
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 15px rgba(150,0,0,0.2);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .hero {
                min-height: 210px;
            }

            .hero-content {
                padding: 25px 18px;
            }

            .hero-title-small {
                font-size: 25px;
            }

            .hero-title-big {
                font-size: 52px;
            }

            .hero-subtitle {
                font-size: 15px;
            }

            .kitkat-logo {
                width: 105px;
                height: 55px;

                font-size: 20px;

                top: 25px;
                right: 18px;
            }

            .game-container {
                padding:
                    25px 18px
                    30px;
            }

            .question-text {
                font-size: 24px;
                margin:
                    20px 5px
                    28px;
            }

            .option-btn {
                font-size: 17px;
                padding: 18px;
            }

            .question-counter {
                font-size: 15px;
                padding: 10px 15px;
            }

            .kitkat-count {
                font-size: 14px;
                padding: 9px 12px;
            }
        }

    </style>
</head>

<body>

<div class="game-wrapper">

    <!-- HEADER -->

    <div class="hero">

        <div class="hero-content">

            <div class="hero-title-small">
                Truy tìm
            </div>

            <div class="hero-title-big">
                KitKat
            </div>

            <div class="hero-subtitle">
                Trả lời đúng – Nhận ngay KitKat! 🍫
            </div>

        </div>

        <div class="kitkat-logo">
            KitKat
        </div>

    </div>


    <!-- GAME -->

    <div class="game-container">


        <!-- QUIZ -->

        <div id="quiz-box">

            <div class="quiz-top">

                <div
                    class="question-counter"
                    id="question-counter"
                >
                    Câu hỏi 1 / 6
                </div>

                <div
                    class="kitkat-count"
                    id="kitkat-count"
                >
                    🍫 0 / 6
                </div>

            </div>


            <h2
                class="question-text"
                id="question-text"
            >
                Đang tải câu hỏi...
            </h2>


            <div
                class="options-list"
                id="options-list"
            >
            </div>


            <!-- PHẦN THƯỞNG -->

            <div
                class="reward-box"
                id="reward-box"
            >

                <div class="reward-bar">
                    KitKat
                </div>

                <div class="reward-text">
                    Bạn nhận được<br>
                    <strong>1 KitKat!</strong>
                </div>

            </div>


            <!-- PROGRESS -->

            <div class="progress-wrapper">

                <div
                    class="progress"
                    id="progress"
                >
                </div>

            </div>

        </div>


        <!-- RESULT -->

        <div
            class="result-screen"
            id="result-screen"
        >

            <h2>
                🎉 Hoàn thành rồi!
            </h2>

            <p>
                Bạn đã vượt qua tất cả câu hỏi!
            </p>

            <div
                class="final-kitkat"
                id="final-kitkat"
            >
                🍫 Bạn nhận được 6 KitKat!
            </div>

            <button
                class="restart-btn"
                onclick="restartGame()"
            >
                🔄 Chơi lại
            </button>

        </div>

    </div>

</div>


<script>

const quizData = [

    {
        question:
        "Tri thức khoa học ở thế kỷ XIX được tích lũy chủ yếu thông qua phương pháp nào?",

        options: [
            "Suy luận triết học thuần túy",

            "Quan sát thực nghiệm, thám hiểm, khảo sát thực địa và đo đạc chính xác",

            "Sách vở và giáo lý tôn giáo",

            "Kinh nghiệm truyền miệng"
        ],

        correct: 1
    },


    {
        question:
        "Một đặc điểm nổi bật của khoa học thế kỷ XIX là:",

        options: [
            "Chỉ dựa vào tư duy triết học",

            "Hạn chế sử dụng thực nghiệm",

            "Xây dựng hệ thống phòng thí nghiệm và thiết bị đo đạc ngày càng tinh vi",

            "Phụ thuộc chủ yếu vào giáo lý tôn giáo"
        ],

        correct: 2
    },


    {
        question:
        "Ai là nhà khoa học tiêu biểu gắn với hiện tượng cảm ứng điện từ?",

        options: [
            "Charles Darwin",

            "Michael Faraday",

            "Dmitri Mendeleev",

            "James Watt"
        ],

        correct: 1
    },


    {
        question:
        "Năm 1869, Dmitri Mendeleev có đóng góp nổi bật nào?",

        options: [
            "Đề xuất học thuyết tiến hóa",

            "Phát hiện hiện tượng cảm ứng điện từ",

            "Xây dựng bảng hệ thống tuần hoàn các nguyên tố hóa học",

            "Phát minh động cơ đốt trong"
        ],

        correct: 2
    },


    {
        question:
        "Bước ngoặt của thế kỷ XIX thể hiện rõ nhất ở sự chuyển biến nào?",

        options: [
            "Từ thực nghiệm sang suy đoán",

            "Từ khoa học chuyên môn hóa sang tri thức tổng hợp",

            "Từ tri thức phân tán sang nghiên cứu chuyên môn hóa, thực nghiệm có hệ thống và đo đạc chính xác",

            "Từ khoa học sang tôn giáo"
        ],

        correct: 2
    },


    {
        question:
        "Vì sao thế kỷ XIX được xem là một bước ngoặt quan trọng của khoa học?",

        options: [
            "Vì khoa học quay lại dựa chủ yếu vào kinh nghiệm",

            "Vì khoa học ngày càng gắn chặt với sản xuất và công nghệ",

            "Vì khoa học không còn cần thực nghiệm",

            "Vì các ngành khoa học bị hợp nhất thành một ngành duy nhất"
        ],

        correct: 1
    }

];


let currentQuestionIndex = 0;

let kitkatScore = 0;

let isTransitioning = false;


const questionCounterEl =
document.getElementById("question-counter");

const questionTextEl =
document.getElementById("question-text");

const optionsListEl =
document.getElementById("options-list");

const rewardBoxEl =
document.getElementById("reward-box");

const kitkatCountEl =
document.getElementById("kitkat-count");

const progressEl =
document.getElementById("progress");

const quizBoxEl =
document.getElementById("quiz-box");

const resultScreenEl =
document.getElementById("result-screen");

const finalKitkatEl =
document.getElementById("final-kitkat");



/* LOAD QUESTION */

function loadQuestion() {

    isTransitioning = false;

    rewardBoxEl.classList.remove("show");

    const currentQ =
    quizData[currentQuestionIndex];


    questionCounterEl.innerText =
    `Câu hỏi ${currentQuestionIndex + 1} / ${quizData.length}`;


    questionTextEl.innerText =
    currentQ.question;


    optionsListEl.innerHTML = "";


    currentQ.options.forEach(
        (option, index) => {

            const btn =
            document.createElement("button");


            btn.className =
            "option-btn";


            btn.innerText =
            option;


            btn.onclick =
            () =>
            selectOption(
                index,
                btn
            );


            optionsListEl.appendChild(btn);

        }
    );


    updateProgress();

}



/* SELECT ANSWER */

function selectOption(
    selectedIndex,
    selectedBtn
) {

    if (isTransitioning) return;


    const currentQ =
    quizData[currentQuestionIndex];


    /* ĐÚNG */

    if (
        selectedIndex ===
        currentQ.correct
    ) {

        isTransitioning = true;


        selectedBtn.classList.add(
            "correct"
        );


        const allButtons =
        optionsListEl.querySelectorAll(
            ".option-btn"
        );


        allButtons.forEach(
            btn =>
            btn.disabled = true
        );


        /* + 1 KITKAT */

        kitkatScore++;


        kitkatCountEl.innerText =
        `🍫 ${kitkatScore} / ${quizData.length}`;


        rewardBoxEl.classList.add(
            "show"
        );


        updateProgress();


        /* PHÁO HOA */

        confetti({

            particleCount: 80,

            spread: 70,

            origin: {
                y: 0.65
            }

        });


        /* CHUYỂN CÂU */

        setTimeout(
            () => {

                currentQuestionIndex++;


                if (
                    currentQuestionIndex <
                    quizData.length
                ) {

                    loadQuestion();

                } else {

                    showResult();

                }

            },

            1500
        );


    }


    /* SAI */

    else {

        selectedBtn.classList.add(
            "wrong",
            "shake"
        );


        setTimeout(
            () => {

                selectedBtn.classList.remove(
                    "wrong",
                    "shake"
                );

            },

            500
        );

    }

}



/* PROGRESS */

function updateProgress() {

    progressEl.innerHTML = "";


    for (
        let i = 0;

        i < quizData.length;

        i++
    ) {

        const step =
        document.createElement("div");


        step.className =
        "progress-step";


        if (
            i <
            currentQuestionIndex
        ) {

            step.classList.add(
                "done"
            );

        }


        if (
            i ===
            currentQuestionIndex
        ) {

            step.classList.add(
                "active"
            );

        }


        step.innerHTML = `

            <div class="circle">
                ${
                    i < currentQuestionIndex
                    ? "✓"
                    : ""
                }
            </div>

            <span>
                ${i + 1}
            </span>

        `;


        progressEl.appendChild(
            step
        );

    }

}



/* RESULT */

function showResult() {

    quizBoxEl.style.display =
    "none";


    resultScreenEl.style.display =
    "block";


    finalKitkatEl.innerText =
    `🍫 Bạn nhận được ${kitkatScore} KitKat!`;


    confetti({

        particleCount: 180,

        spread: 120,

        origin: {
            y: 0.55
        }

    });

}



/* RESTART */

function restartGame() {

    currentQuestionIndex = 0;

    kitkatScore = 0;


    kitkatCountEl.innerText =
    `🍫 0 / ${quizData.length}`;


    quizBoxEl.style.display =
    "block";


    resultScreenEl.style.display =
    "none";


    loadQuestion();

}



/* START */

loadQuestion();

</script>

</body>
</html>
